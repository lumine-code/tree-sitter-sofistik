name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Test the CLI download transport
        run: node --test scripts/tree-sitter-download.test.js
      - run: npm ci
        env:
          NODE_OPTIONS: --require ${{ toJSON(format('{0}/scripts/tree-sitter-download.js', github.workspace)) }}
      - run: npm run build:wasm
      - run: npm run test:wasm
      - run: npm test
      - run: npm run test:fuzz
      - run: npm pack --dry-run
